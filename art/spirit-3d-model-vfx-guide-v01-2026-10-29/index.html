<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光精灵 · 建模与特效三视图</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e6de;color:#303835;font-family:"Microsoft YaHei",system-ui,sans-serif;line-height:1.8}main{max-width:1280px;margin:auto;padding:30px 24px}h1{font-size:29px;font-weight:500;margin:0 0 8px}p{margin:8px 0;color:#59615e}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{font:inherit;cursor:pointer;border:1px solid #b9c3bd;border-radius:6px;background:#f7f5ef;color:#35423d;padding:9px 17px}button[aria-pressed="true"]{background:#354a42;color:#fff;border-color:#354a42}figure{margin:0;background:#f9f7f1;border:1px solid #d3d0c6}img{width:100%;height:auto;display:block}figcaption{padding:13px 18px;font-size:14px;color:#59615e}a{color:#725b35;text-underline-offset:3px}.note{font-size:13px;margin-top:20px}.steps{margin-top:24px;padding:18px 22px;background:#f4f2eb}.steps strong{color:#354a42}@media(max-width:700px){main{padding:24px 12px}h1{font-size:23px}}</style></head>
<body><main><h1>光精灵 · 建模与特效三视图</h1><p>大头、小身体、水滴手足。正面 / 右侧 / 背面。</p>
<nav><button id="base" aria-pressed="true" onclick="show('base')">基础模型</button><button id="fx" aria-pressed="false" onclick="show('fx')">光焰与拖尾示意</button></nav>
<figure><a id="original" href="01-model-orthographic.png" target="_blank"><img id="sheet" src="01-model-orthographic.png" width="1536" height="1024" alt="无特效基础模型三视图"></a><figcaption id="caption">建模主体：封闭圆头、短小躯干和手足。细碎发梢与星尘属于独立特效层。</figcaption></figure>
<div class="steps"><strong>建议制作顺序</strong><p>正交相机与基础模型 → 水彩材质和胸口光核 → 后脑光焰薄片 → 世界空间星尘与背部拖尾 → 弱 Bloom 与化光过渡。</p><p><a href="制作说明.md">完整制作说明与已核验的 GitHub 资料</a> · <a href="prompts.json">内置 imagegen 提示词</a></p></div>
<p class="note">这是建模参考插画与特效分层方案，尚不是实际 3D 模型的渲染；未交付 FBX 或运行中的 Unity 特效。2026-10-29。</p>
</main><script>
const states={base:{src:"01-model-orthographic.png",alt:"无特效基础模型三视图",caption:"建模主体：封闭圆头、短小躯干和手足。细碎发梢与星尘属于独立特效层。"},fx:{src:"02-vfx-orthographic.png",alt:"光焰与拖尾效果三视图",caption:"效果示意：后上脑光焰跟随头部，脱落星尘与身后尾迹独立模拟；脸部和四肢保持清晰。"}};
function show(key){const s=states[key];document.getElementById("sheet").src=s.src;document.getElementById("sheet").alt=s.alt;document.getElementById("original").href=s.src;document.getElementById("caption").textContent=s.caption;for(const id of ["base","fx"])document.getElementById(id).setAttribute("aria-pressed",String(id===key));}
</script></body></html>
