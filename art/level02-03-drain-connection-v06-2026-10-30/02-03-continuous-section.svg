<text x="165" y="748" font-size="18" fill="#334441" text-anchor="start">盆内地面 → 下行短阶 → 盆沿下方连接段 → 主渠干燥渠沿 → 原第三关转角</text>
<text x="68" y="782" font-size="17" fill="#334441" text-anchor="start">镜头关系</text>
<text x="165" y="782" font-size="16" fill="#5e6e65" text-anchor="start">游玩时保持 16H 画面高度，随角色向右、向下跟随；此展开图用于说明空间，不是单屏游戏构图。</text>
<text x="68" y="815" font-size="15" fill="#69766b" text-anchor="start">同高的三个小精灵表示同一角色在不同位置；背景中的尾部不占用前景行走线。水面比主渠步道低 0.65H。</text>
