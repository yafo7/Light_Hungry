<text x="1580" y="1004" font-size="20" font-weight="normal" text-anchor="start">同一操作台切A/B、找孔并调镜</text>
<text x="1580" y="1047" font-size="20" font-weight="normal" text-anchor="start">离开观察后按X/Z步道自动选镜头</text>
