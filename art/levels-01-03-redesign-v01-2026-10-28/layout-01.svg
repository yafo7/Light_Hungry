<text x="1580" y="1004" font-size="20" font-weight="normal" text-anchor="start">移动 → 短跳 → 操作一面镜</text>
<text x="1580" y="1047" font-size="20" font-weight="normal" text-anchor="start">源、镜、目标同屏</text>
