<text x="1580" y="1220" font-size="18" font-weight="normal" text-anchor="start">共同约束：稳定光源 · 无消耗 · 无计时</text>
<text x="1580" y="1254" font-size="18" font-weight="normal" text-anchor="start">静态已检查：反射方向／穿墙／步行覆盖</text>
<text x="1580" y="1288" font-size="18" font-weight="normal" text-anchor="start">尚需灰盒实测：控制手感／镜头／跳跃</text>
<text x="65" y="1374" font-size="21" font-weight="normal" text-anchor="start">尺寸单位 H；前三关普通场景不因投影重合而通行。剖切只影响显示；碰撞、光遮挡与道具角度始终保留。</text>
