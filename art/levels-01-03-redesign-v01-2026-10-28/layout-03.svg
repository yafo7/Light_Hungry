<text x="1590" y="820" font-size="19" font-weight="normal" text-anchor="start">金色：完成态光线   蓝虚线：真实步行线</text>
<text x="1590" y="850" font-size="19" font-weight="normal" text-anchor="start">圆环：镜架操作位   方框：安全观察点</text>
