<text x="80" y="235" font-size="20" font-weight="normal" text-anchor="start">镜头固定轻俯20°；只增强转向可读性，光线世界高度仍为1.8H。</text>
<text x="1580" y="200" font-size="25" font-weight="bold" text-anchor="start">俯视 XZ｜真实光路与行走</text>
<text x="1580" y="235" font-size="20" font-weight="normal" text-anchor="start">所有光段 y = 1.8H；人物高 1H</text>
