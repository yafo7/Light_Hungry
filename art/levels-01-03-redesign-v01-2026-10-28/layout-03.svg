<text x="60" y="65" font-size="38" font-weight="bold" text-anchor="start">03｜L形排水暗渠 · 结构设计</text>
<text x="60" y="112" font-size="23" font-weight="normal" text-anchor="start">20°轻俯正交侧视 + 俯视光路校核｜微小主角 H=1｜灰盒设计，非实测可玩</text>
