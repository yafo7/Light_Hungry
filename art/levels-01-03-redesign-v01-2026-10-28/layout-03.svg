<text x="1580" y="958" font-size="25" font-weight="bold" text-anchor="start">本关规则</text>
<text x="1580" y="1004" font-size="20" font-weight="normal" text-anchor="start">先让 M1 照到 M2，再调整 M2</text>
<text x="1580" y="1047" font-size="20" font-weight="normal" text-anchor="start">A看横段；B看纵段</text>
<text x="1580" y="1090" font-size="20" font-weight="normal" text-anchor="start">转角观察平台足够站稳和回调</text>
<text x="1580" y="1133" font-size="20" font-weight="normal" text-anchor="start">完整光路成立后出口永久开放</text>
<text x="1580" y="1220" font-size="18" font-weight="normal" text-anchor="start">共同约束：稳定光源 · 无消耗 · 无计时</text>
<text x="1580" y="1254" font-size="18" font-weight="normal" text-anchor="start">静态已检查：反射方向／穿墙／步行覆盖</text>
<text x="1580" y="1288" font-size="18" font-weight="normal" text-anchor="start">尚需灰盒实测：控制手感／镜头／跳跃</text>
<text x="65" y="1374" font-size="21" font-weight="normal" text-anchor="start">尺寸单位 H；前三关普通场景不因投影重合而通行。剖切只影响显示；碰撞、光遮挡与道具角度始终保留。</text>
